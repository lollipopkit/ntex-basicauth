[package]
name = "ntex-basicauth"
version = "0.4.1"
edition = "2024"
rust-version = "1.88"
authors = ["lollipopkit <a@lollipopkit.com>"]
description = "A Basic Authentication middleware for ntex web framework."
license = "MIT"
repository = "https://github.com/lollipopkit/ntex-basicauth"
readme = "README.md"
keywords = ["ntex", "basic-auth", "middleware", "authentication", "security"]
categories = ["web-programming", "authentication"]

[features]
default = ["cache", "regex", "bcrypt"]
bcrypt = ["dep:bcrypt"]
cache = ["dep:getrandom"]
regex = ["dep:regex"]

[dependencies]
base64 = "0.22"
bcrypt = { version = "0.19", optional = true }
getrandom = { version = "0.4", optional = true }
log = "0.4"
ntex = "3"
ipnet = "2"
regex = { version = "1", optional = true }
sha2 = "0.11"
subtle = "2"
thiserror = "2"
zeroize = { version = "1", features = ["zeroize_derive"] }

[dev-dependencies]
ntex = { version = "3", features = ["tokio"] }
tempfile = "3"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
